<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<style>
	html{
	width: 200vw;
	}

	@media (max-width: 1023px){
		html{
		width: auto;
		height: 200vh;
		}
	}

	body{
	background-color: #d6d6d6;
	display: flex;
	height: 100vh;
	justify-content: center;
	align-items: center;

	&:has(.h-front:hover){
		background-color: black;

		section{
		border: white 1px solid;
		background: linear-gradient(0deg in oklch, black 40%, #F5296B 60%);

		.h-front{
			background-color: black;
			color: greenyellow;
		}

		.pic-front{
			content: url(/src/lib/assets/boos.png);
		}

		li{
			font-family: drawn;
			border-bottom: dashed yellowgreen;
		}

		li:nth-of-type(even){
			color: yellow;

			p:first-of-type{
			color: lightblue;
			}
		}

		li:nth-of-type(odd){
			color: purple;

			p:first-of-type{
			color: white;
			}
		}
		}

		h1{
		font-family: drawn;
		color: lightblue;
		}
	}
	}
</style>
